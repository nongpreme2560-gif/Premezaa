name: Build Preme's mod APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Preme's mod APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Premes-mod.apk"
          ls -lh dist/

      - name: Upload Premes-mod.apk
        uses: actions/upload-artifact@v4
        with:
          name: Premes-mod-APK
          path: dist/Premes-mod.apk
          retention-days: 30
